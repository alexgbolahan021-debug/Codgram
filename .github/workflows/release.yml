name: Desktop release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v2.2.0
        required: true
        type: string
      release_mode:
        description: Linux-first publishes Linux artifacts only; full-signed also runs credential-dependent macOS and Windows signing.
        required: true
        default: linux-first
        type: choice
        options:
          - linux-first
          - full-signed

permissions:
  contents: write

concurrency:
  group: codgram-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos:
    name: macOS signed and notarized installers
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'full-signed'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Package, sign, and notarize macOS installers
        run: pnpm exec electron-builder --mac dmg zip --x64 --arm64 --publish never -c.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: codgram-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  windows:
    name: Windows signed NSIS installers
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'full-signed'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Package and sign Windows installers
        run: pnpm exec electron-builder --win nsis --x64 --arm64 --publish never -c.forceCodeSigning=true
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: codgram-windows
          if-no-files-found: error
          path: release/*.exe

  linux:
    name: Linux installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the release tag matches the packaged version
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) throw new Error('Release tag must match package.json version');"
      - run: pnpm check
      - run: pnpm build
      - name: Package Linux installers
        run: pnpm exec electron-builder --linux AppImage deb rpm --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: codgram-linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm

  publish:
    name: Create draft GitHub release
    needs: [macos, windows, linux]
    if: >-
      always() && needs.linux.result == 'success' &&
      (github.event_name == 'push' || github.event.inputs.release_mode == 'linux-first' ||
      (needs.macos.result == 'success' && needs.windows.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --title "Codgram $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release/* --clobber
